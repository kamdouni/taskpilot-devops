openapi: 3.1.0
info:
  title: TaskPilot API
  version: 1.0.0
  description: Contrat de la spec 001 — source de vérité de l'API des tâches.
servers:
  - url: http://localhost:8080
    description: API locale (Docker Compose)
  - url: http://localhost:4010
    description: Mock du contrat (worktree QA)

paths:
  /health:
    get:
      operationId: getHealth
      summary: État de l'API et de la base (AC-01)
      responses:
        '200':
          description: API opérationnelle
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [ok] }

  /api/tasks:
    get:
      operationId: listTasks
      summary: Lister les tâches (AC-10, AC-11, AC-12)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: itemsPerPage, in: query, schema: { type: integer, minimum: 1, default: 20 } }
      responses:
        '200':
          description: Tâches triées par createdAt décroissant (50 maximum)
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/Task' }
    post:
      operationId: createTask
      summary: Créer une tâche (AC-02 à AC-07)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Tâche créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTask
      summary: Lire une tâche (AC-08, AC-09)
      responses:
        '200':
          description: La tâche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTask
      summary: Modifier partiellement une tâche (AC-13, AC-14)
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: Tâche modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteTask
      summary: Supprimer une tâche (AC-15)
      responses:
        '204': { description: Tâche supprimée }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    Status:
      type: string
      enum: [todo, in_progress, done]
    Priority:
      type: string
      enum: [low, medium, high]
    TaskInput:
      type: object
      description: Les champs id, createdAt et updatedAt sont ignorés s'ils sont envoyés (RM-05).
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { type: string }
        priority: { type: string }
        dueDate: { type: [string, 'null'], format: date }
    Task:
      type: object
      required: [id, title, description, status, priority, dueDate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/Status' }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [status, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [violations]
          properties:
            violations:
              type: array
              minItems: 1
              items:
                type: object
                required: [propertyPath, message]
                properties:
                  propertyPath: { type: string }
                  message: { type: string }

  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Données invalides
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
